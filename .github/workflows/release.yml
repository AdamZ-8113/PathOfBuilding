name: Release next version
run-name: Release version ${{ inputs.releaseVersion }}
on:
  workflow_dispatch:
      inputs:
          releaseVersion:
              description: 'Version number to use for this release'
              required: true
              default: '2.x.x'
          releaseNoteUrl:
              description: 'Enter the location of edited release notes to use'
              required: false
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_pr: ${{ steps.prepare.outputs.pull-request-number }}
    permissions:
      contents: write
    steps:
      - name: Prepare rehearsal branch without opening a PR or publishing
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$GH_REPO/git/refs" -f ref=refs/heads/release-0.0.0-corpus-rehearsal -f sha=ce423a327b7d3f893de9276ea6dffd71edbd265a
          echo "pull-request-number=rehearsal-branch-ready" >> "$GITHUB_OUTPUT"
  start-corpus-check:
    needs: release
    if: ${{ needs.release.outputs.release_pr }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # A branch push made by the release job's GITHUB_TOKEN does not start push workflows.
      - name: Start comparison on the prepared release branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: release-${{ inputs.releaseVersion }}
        run: gh workflow run buildtest.yml --repo "$GH_REPO" --ref "$RELEASE_BRANCH"
